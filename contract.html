<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventFlow Contract</title>
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://eventflowsales.com/contract">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/eventflow-shared.css" />
  <link rel="stylesheet" href="/bookings.css" />
  <script src="/bookings-shared.js"></script>
</head>
<body style="background:#E2E8F0">
<script>
  (function(){
    try {
      if (localStorage.getItem('sb-uzojlcwsrbsqckycjlgm-auth-token')) {
        var s = document.createElement('style');
        s.textContent = '#login-screen{display:none !important}';
        document.head.appendChild(s);
      }
    } catch(e) {}
  })();
</script>

<div id="login-screen">
  <div class="login-box">
    <div class="logo">EventFlow</div>
    <div class="subtitle">Contract</div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="signInWithGoogle()">Continue with Google</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="no-print" style="max-width:800px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:space-between;align-items:center">
    <a class="btn ghost" id="back-link" href="/bookings">&larr; Back</a>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="copySignLink()" id="copy-link-btn" style="display:none">Copy Signing Link</button>
      <button class="btn" onclick="window.print()" id="print-btn" style="display:none">Print / Save as PDF</button>
    </div>
  </div>
  <div class="doc-page contract-body" id="doc"></div>
  <div class="doc-page" id="record" style="display:none;margin-top:16px"></div>
</div>

<script>
/* CONTRACT_DEPOSIT_V1 (2026-11-03). This page used to write out built-in contract wording for any booking. That wording
   was wrong for real venues and contradicted itself (a "non-refundable" deposit next to a refund schedule), so it is gone.
   The page now shows only the exact copy locked when the manager approved it, or says there is none. */
let signUrl = null;

window.addEventListener('load', boot);

function message(text) {
  document.getElementById('app').style.display = 'block';
  const p = document.createElement('p');
  p.textContent = text;
  document.getElementById('doc').replaceChildren(p);
}

async function boot() {
  const sb = await getSupabase();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById('login-screen').style.display = 'flex'; return; }
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) return message('No booking id.');

  const { data: b, error: be } = await sb.from('bookings').select('id, event_name').eq('id', id).maybeSingle();
  if (be || !b) return message('Booking not found.');
  document.getElementById('back-link').href = `/booking?id=${id}`;
  document.title = 'Contract: ' + b.event_name;

  const { data: contracts, error: ce } = await sb.from('contracts').select('*').eq('booking_id', id).order('version', { ascending: false });
  const active = (!ce && (contracts || []).find((c) => c.status !== 'voided' && c.status !== 'draft' && c.body_html)) || null;
  if (!active) return message('There is no contract for this booking. A contract is only created from a venue\'s approved wording.');

  const { data: sigs } = await sb.from('signatures').select('*').eq('contract_id', active.id).order('signed_at', { ascending: false }).limit(1);
  const signature = sigs && sigs[0];
  if (active.access_token && active.status === 'sent') {
    signUrl = `${window.location.origin}/sign?token=${active.access_token}`;
    document.getElementById('copy-link-btn').style.display = '';
  }
  document.getElementById('print-btn').style.display = '';
  document.getElementById('app').style.display = 'block';
  document.getElementById('doc').innerHTML = active.body_html;

  const record = document.getElementById('record');
  const lines = [`Contract version ${active.version}${active.mode === 'test' ? ' (test mode, no real money)' : ''}. Fingerprint ${esc((active.body_hash || '').slice(0, 16))}.`];
  if (signature) {
    lines.push(`Signed by <strong>${esc(signature.signer_name)}</strong> (${esc(signature.signer_email)}) on ${esc(new Date(signature.signed_at).toLocaleString('en-US'))}. IP ${esc(signature.signer_ip || 'not recorded')}.`);
    if (signature.consent_text) lines.push(`They agreed: ${esc(signature.consent_text)}`);
  } else {
    lines.push('Not signed yet.');
  }
  if (active.paid_at) lines.push(`Deposit of ${fmtMoney((active.deposit_cents || 0) / 100)} paid ${esc(new Date(active.paid_at).toLocaleString('en-US'))}.`);
  record.innerHTML = lines.map((l) => `<p style="font-size:13px;margin:0 0 6px">${l}</p>`).join('');
  record.style.display = 'block';
}

async function copySignLink() {
  if (!signUrl) return;
  const btn = document.getElementById('copy-link-btn');
  try {
    await navigator.clipboard.writeText(signUrl);
    const prev = btn.textContent;
    btn.textContent = 'Link copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 2500);
  } catch {
    // Clipboard access denied: prompt() still lets the user copy by hand.
    prompt('Copy signing link:', signUrl);
  }
}
</script>
</body>
</html>
